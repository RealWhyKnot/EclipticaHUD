name: Bug report
description: Something does not work
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: EclipticaHUD version
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log or screenshot
      description: Paste anything relevant. Remove names or IDs you don't want public.
      render: text
    validations:
      required: false
