name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (vYYYY.M.D.N or vYYYY.M.D.N-beta)
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish ${{ inputs.tag || github.ref_name }}
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve tag
        id: tag
        uses: RealWhyKnot/workflows/resolve-tag@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          tag-pattern: '^v\d{4}\.\d+\.\d+\.\d+(-beta)?$'

      - name: Wait for CI
        uses: RealWhyKnot/workflows/wait-for-ci@v1
        with:
          sha: ${{ steps.tag.outputs.sha }}
          workflow: ci.yml

      - name: Install LLVM for bindgen
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files\LLVM\bin\libclang.dll')) {
            choco install llvm -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install llvm failed ($LASTEXITCODE)" }
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value 'LIBCLANG_PATH=C:\Program Files\LLVM\bin'

      - name: Build
        shell: pwsh
        env:
          EHUD_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          cargo build --release
          if ($LASTEXITCODE -ne 0) { throw "build failed ($LASTEXITCODE)" }

      - name: Package
        id: package
        shell: pwsh
        env:
          EHUD_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          $name = "ecliptica-hud-$env:EHUD_VERSION.exe"
          $exe = "target/release/$name"
          Copy-Item target/release/ecliptica-hud.exe $exe
          $sizeMiB = [math]::Round((Get-Item -LiteralPath $exe).Length / 1MB, 2)
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "exe=$exe"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "name=$name"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "size=$sizeMiB"

      - name: Checksums
        id: checksums
        uses: RealWhyKnot/workflows/checksums@v1
        with:
          archives: ${{ steps.package.outputs.exe }}
          manifest: "false"
          sidecar: "true"

      - name: Build release notes
        id: notes
        uses: RealWhyKnot/workflows/release-notes@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          title: Ecliptica HUD ${{ env.RELEASE_TAG }}
          extra: |
            ### Download

            - `${{ steps.package.outputs.name }}` (${{ steps.package.outputs.size }} MiB)
            - SHA256 `${{ steps.checksums.outputs.sha256 }}`

      - name: Publish release
        uses: RealWhyKnot/workflows/publish-release@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          notes-file: ${{ steps.notes.outputs.file }}
          target: ${{ steps.tag.outputs.sha }}
          prerelease: ${{ steps.tag.outputs.prerelease }}
          draft-first: 'true'
          verify-asset: ${{ steps.package.outputs.name }}
          verify-sha256: ${{ steps.checksums.outputs.sha256 }}
          assets: |
            ${{ steps.package.outputs.exe }}
            ${{ steps.checksums.outputs.sidecars }}

      - name: Remove partial draft on failure
        if: failure()
        shell: pwsh
        run: |
          $draft = gh release view $env:RELEASE_TAG --repo '${{ github.repository }}' --json isDraft --jq .isDraft 2>$null
          if ($draft -eq 'true') { gh release delete $env:RELEASE_TAG --repo '${{ github.repository }}' --yes 2>$null }
          $global:LASTEXITCODE = 0
