[package]
name = "ecliptica-hud"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
description = "Boss target and damage HUD for Ecliptica in VRChat, desktop panel plus SteamVR overlay"

[dependencies]
openvr = "0.9.0"
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
rusqlite = { version = "0.41", features = ["bundled"] }
num-traits = { version = "0.2.19", default-features = false, features = ["std"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Media_Audio",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Pipes",
    "Win32_Networking_WinHttp",
    "Win32_Security_Cryptography",
    "Win32_System_Time",
]

[lints]
workspace = true

[workspace]
resolver = "3"

[workspace.lints.rust]
unknown_lints = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
self_named_module_files = "deny"
ref_option = "deny"
needless_pass_by_value = "deny"
fn_params_excessive_bools = "deny"
clone_on_ref_ptr = "deny"
redundant_clone = "deny"
match_wildcard_for_single_variants = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_lossless = "deny"
cast_precision_loss = "deny"
as_conversions = "deny"
map_err_ignore = "deny"
format_push_string = "deny"
needless_collect = "deny"
significant_drop_tightening = "deny"
manual_assert_eq = "deny"
assert_is_empty = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
